<section class="ht-section{% if is_editor and not section.is_enabled %} is-section-hidden{% endif %}" id="socials"{% if is_editor %} data-section-wrap{% endif %}>
  <div class="container">
    <div class="ht-section-head" style="display:flex;align-items:center;justify-content:space-between">
      <h2>{{ section.get_heading }}</h2>
      {% include "store_templates/_section_controls.html" %}
    </div>
    {% if is_editor %}
      <div>
        {% for row in editor_social_rows %}
          <div class="editor-social-row">
            <span class="editor-social-label">{{ row.label }}</span>
            <span data-social-field="{{ row.platform }}" contenteditable="true">{{ row.url }}</span>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <div class="ht-socials">{% for link in social_links %}<a href="{{ link.url }}" target="_blank" rel="noopener" class="ht-social-btn">{{ link.get_platform_display }}</a>{% endfor %}</div>
    {% endif %}
  </div>
</section>
