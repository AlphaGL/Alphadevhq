<section class="ht-section{% if is_editor and not section.is_enabled %} is-section-hidden{% endif %}" id="about"{% if is_editor %} data-section-wrap{% endif %}>
  <div class="container">
    <div class="ht-section-head" style="display:flex;align-items:center;justify-content:space-between">
      <h2>{{ section.get_heading }}</h2>
      {% include "store_templates/_section_controls.html" %}
    </div>
    <div class="ht-about-grid">
      <div class="ht-about-body">
        {% if is_editor %}
          <p style="white-space:pre-line" data-editable-field="bio" data-placeholder="Write a sentence or two about your practice's story and approach to care" contenteditable="true">{{ store.bio }}</p>
        {% else %}
          <p>{{ section.body|default:store.bio|linebreaksbr }}</p>
        {% endif %}
      </div>
      {% if store.tagline or is_editor %}
      <div class="ht-quote-box">
        <svg class="ht-quote-mark ht-icon" viewBox="0 0 24 24" width="26" height="26"><path d="M7 7h4v4c0 3-2 5-5 5v-2c1.5 0 2.5-1 2.8-2.3H7V7Zm8 0h4v4c0 3-2 5-5 5v-2c1.5 0 2.5-1 2.8-2.3H15V7Z" fill="currentColor" stroke="none"/></svg>
        <p{% if is_editor %} data-editable-field="tagline" data-singleline contenteditable="true"{% endif %}>{{ store.tagline }}</p>
      </div>
      {% endif %}
    </div>
  </div>
</section>
