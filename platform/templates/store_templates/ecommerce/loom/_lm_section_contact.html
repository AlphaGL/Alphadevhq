<section id="contact" class="container py-5{% if is_editor and not section.is_enabled %} is-section-hidden{% endif %}"{% if is_editor %} data-section-wrap{% endif %}>
  <div class="lm-cta-box text-center">
    <div class="d-flex align-items-center justify-content-center gap-3 mb-3">
      <span class="lm-tag" style="color:#c9cabb">Contact Us</span>
      {% include "store_templates/_section_controls.html" %}
    </div>
    <h2 class="fw-bold mb-3 text-white">{{ section.get_heading }}</h2>
    <p class="mb-3" style="opacity:.8">Questions about a piece or an order? Message us any time.</p>
    {% if is_editor %}
      <span class="fw-bold fs-5 d-block mb-4 text-white" data-editable-field="phone" data-singleline data-placeholder="2348012345678" contenteditable="true">{{ store.phone }}</span>
    {% endif %}
    <a href="{{ store.whatsapp_url|default:'#contact' }}" target="_blank" rel="noopener" class="lm-btn" style="background:#fff;color:var(--lm-dark)">
      <i class="bi bi-whatsapp me-2"></i>Order on WhatsApp
    </a>
  </div>
</section>
