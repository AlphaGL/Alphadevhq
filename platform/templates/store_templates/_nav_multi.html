<nav class="store-nav">
  <div class="store-nav-inner">
    <a href="{{ nav_pages.0.url }}" class="store-nav-brand">
      {% if store.logo %}<img src="{{ store.logo.url }}" alt="">{% endif %}
      {{ store.business_name }}
    </a>
    <button type="button" class="store-nav-toggle" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg>
    </button>
    <div class="store-nav-links">
      {% for p in nav_pages %}
        <a href="{{ p.url }}"{% if p.slug == current_slug %} class="is-current"{% endif %}>{{ p.label }}</a>
      {% endfor %}
      {% if current_slug == 'services' %}
      <div class="store-nav-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35" stroke-linecap="round"/></svg>
        <input type="text" class="store-search-input" placeholder="Search services">
      </div>
      {% endif %}
    </div>
    {% if store.whatsapp_url %}<a href="{{ store.whatsapp_url }}" target="_blank" rel="noopener" class="store-nav-cta">{{ cta_label|default:"WhatsApp" }}</a>{% endif %}
  </div>
</nav>
