<section id="contact" class="section-padding bg-white{% if is_editor and not section.is_enabled %} is-section-hidden{% endif %}"{% if is_editor %} data-section-wrap{% endif %}>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <div class="flex items-center justify-center gap-3 mb-4">
      <span class="section-tag"><i data-lucide="phone-call" class="w-3.5 h-3.5"></i>Contact Us</span>
      {% include "store_templates/_section_controls.html" %}
    </div>
    <h2 class="font-heading font-bold text-3xl lg:text-4xl text-slate-900 mb-4">{{ section.get_heading }}</h2>
    <p class="text-slate-500 mb-3">We're here to answer your questions and help however we can.</p>
    {% if is_editor %}
      <span class="text-red-600 font-bold text-lg block mb-8" data-editable-field="phone" data-singleline data-placeholder="2348012345678" contenteditable="true">{{ store.phone }}</span>
    {% endif %}
    <a href="{{ store.whatsapp_url|default:'#contact' }}" target="_blank" rel="noopener" class="btn-primary inline-flex">
      <i data-lucide="message-circle" class="w-5 h-5"></i>
      Book on WhatsApp
    </a>
  </div>
</section>
