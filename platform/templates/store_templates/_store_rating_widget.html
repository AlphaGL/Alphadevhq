<section id="rating" style="padding:50px 20px;max-width:560px;margin:0 auto;text-align:center;font-family:system-ui,-apple-system,Arial,sans-serif">
  <div style="margin-bottom:18px">
    {% if store.rating_count %}
      <span style="font-size:30px;font-weight:700;color:#222">{{ store.average_rating|floatformat:1 }}</span>
      <span style="color:#f5a623;font-size:22px">&#9733;</span>
      <span style="color:#777;font-size:13.5px"> ({{ store.rating_count }} rating{{ store.rating_count|pluralize }})</span>
    {% else %}
      <p style="color:#777;font-size:14px;margin:0">No ratings yet — be the first to rate this business.</p>
    {% endif %}
  </div>
  <form id="ratingForm" data-rate-url="{% url 'stores:submit_rating' store.slug %}" style="display:inline-block;text-align:left;width:100%;max-width:340px">
    {% csrf_token %}
    <div id="ratingStars" style="font-size:30px;letter-spacing:6px;cursor:pointer;text-align:center;line-height:1">
      {% for n in "12345" %}<span data-star="{{ n }}" style="color:#ddd">&#9733;</span>{% endfor %}
    </div>
    <input type="hidden" name="stars" id="ratingStarsInput" value="0">
    <textarea name="comment" maxlength="300" placeholder="Optional comment" rows="2" style="width:100%;margin-top:12px;padding:9px 11px;border-radius:8px;border:1px solid #ddd;font-size:13px;font-family:inherit;box-sizing:border-box"></textarea>
    <button type="submit" style="margin-top:10px;width:100%;padding:11px;border:none;border-radius:8px;background:#1b1b1b;color:#fff;font-weight:600;font-size:13.5px;cursor:pointer">Submit Rating</button>
    <p id="ratingMsg" style="margin-top:8px;font-size:12.5px;color:#1c8c63;display:none;text-align:center"></p>
  </form>
</section>
<script>
(function(){
  var form = document.getElementById('ratingForm');
  if (!form) return;
  var stars = form.querySelectorAll('[data-star]');
  var input = document.getElementById('ratingStarsInput');
  function paint(n){
    stars.forEach(function(s){ s.style.color = parseInt(s.getAttribute('data-star'), 10) <= n ? '#f5a623' : '#ddd'; });
  }
  stars.forEach(function(s){
    s.addEventListener('click', function(){
      var n = parseInt(s.getAttribute('data-star'), 10);
      input.value = n;
      paint(n);
    });
  });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    if (!input.value || input.value === '0') { alert('Pick a star rating first.'); return; }
    var btn = form.querySelector('button');
    btn.disabled = true;
    fetch(form.getAttribute('data-rate-url'), { method: 'POST', body: new FormData(form) })
      .then(function(r){ return r.json(); })
      .then(function(data){
        var msg = document.getElementById('ratingMsg');
        if (data.ok) {
          msg.textContent = 'Thanks for your rating!';
          msg.style.display = 'block';
        } else {
          btn.disabled = false;
          alert(data.error || 'Could not submit rating.');
        }
      })
      .catch(function(){ btn.disabled = false; alert('Could not submit rating — try again.'); });
  });
})();
</script>
